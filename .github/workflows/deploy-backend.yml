name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Diagnose GCP context
        run: |
          echo "=== AUTH ==="
          gcloud auth list

          echo "=== CONFIG ==="
          gcloud config list

          echo "=== PROJECT ==="
          gcloud config get-value project

          echo "=== PROJECT FROM SECRET ==="
          echo "${{ secrets.GCP_PROJECT_ID }}"

          echo "=== REGION FROM SECRET ==="
          echo "${{ secrets.GCP_REGION }}"

          echo "=== ARTIFACT REGISTRY ==="
          gcloud artifacts repositories describe nook-backend \
            --location="${{ secrets.GCP_REGION }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}"

      - name: Verify GCP identity
        run: |
          gcloud auth list

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            ${{ secrets.GCP_REGION }}-docker.pkg.dev \
            --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/nook-backend/backend:${{ github.sha }} .

      - name: Verify Artifact Registry
        run: |
          echo "Project: ${{ secrets.GCP_PROJECT_ID }}"
          echo "Region: ${{ secrets.GCP_REGION }}"

          gcloud config get-value project

          gcloud artifacts repositories describe nook-backend \
            --location=${{ secrets.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Push image
        run: |
          docker push \
            ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/nook-backend/backend:${{ github.sha }}

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy nook-backend \
            --image ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/nook-backend/backend:${{ github.sha }} \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated
