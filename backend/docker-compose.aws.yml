services:
  rabbitmq:
    image: rabbitmq:3-alpine
    container_name: nook-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nook-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      - PORT=3003
      - FRONTEND_URL=${FRONTEND_URL:-https://nookmy.vercel.app}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - BACKEND_URL=${BACKEND_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - API_KEY=${API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nook-github-worker
    restart: unless-stopped
    command: ["node", "dist/queue/github-worker.js"]
    environment:
      - FRONTEND_URL=${FRONTEND_URL:-https://nookmy.vercel.app}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:3003}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq_data:
